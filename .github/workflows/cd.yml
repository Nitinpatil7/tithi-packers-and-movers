name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - master
    types:
      - completed
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Independent Apps
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build website
        working-directory: frontend
        run: npm run build:website

      - name: Build admin
        working-directory: frontend
        run: npm run build:admin

      - name: Build monitoring
        working-directory: frontend
        run: npm run build:monitoring

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy backend
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_BACKEND_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then echo "DEPLOY_BACKEND_COMMAND not configured; skipping."; exit 0; fi
          eval "$DEPLOY_COMMAND"

      - name: Deploy website
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_WEBSITE_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then echo "DEPLOY_WEBSITE_COMMAND not configured; skipping."; exit 0; fi
          eval "$DEPLOY_COMMAND"

      - name: Deploy admin
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_ADMIN_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then echo "DEPLOY_ADMIN_COMMAND not configured; skipping."; exit 0; fi
          eval "$DEPLOY_COMMAND"

      - name: Deploy monitoring
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_MONITORING_COMMAND }}
        run: |
          if [ -z "$DEPLOY_COMMAND" ]; then echo "DEPLOY_MONITORING_COMMAND not configured; skipping."; exit 0; fi
          eval "$DEPLOY_COMMAND"
